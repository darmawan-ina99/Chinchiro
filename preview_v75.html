    <script>function select(q){
 return document.querySelector(q);
}

function selectAll(q){
 return document.querySelectorAll(q);
}

function elById(id){
 return document.getElementById(id);
}


function elAnim(el,anim){
    oldAnim=el.classList.item(el.classList.length-1);
    el.classList.remove(oldAnim);
    setTimeout(function(){
      el.classList.add("animate__animated","animate__"+anim);
    },200);
}

function showAndHide(page,animShow,animHide,time,text){
  if(text){
   elById(page).innerHTML= text;
  }
  showPage(page,animShow);
  setTimeout(hidePage,time,page,animHide);
}


function showPage(id,anim){
   window.scrollTo(0,0);
   var el=elById(id);
   if( el.style.display!="block"){
    el.style.display="block";
    zIndexPage+=1;
    el.style.zIndex=zIndexPage;
    oldAnim=el.classList.item(el.classList.length-1);
    el.classList.remove(oldAnim);
    el.classList.add("animate__animated","animate__"+(anim||"slideIn"));
    containerPage.push(id);
   }
}

function hidePage(id,anim){
    var el=elById(id);
    oldAnim=el.classList.item(el.classList.length-1);
    el.classList.remove(oldAnim);
    el.classList.add("animate__animated","animate__"+(anim||"rotateOutUpRight"));
    var index = containerPage.indexOf(id);
    if(index > -1) {
      containerPage.splice(index, 1);
      }
   
    setTimeout(function(){el.style.display="none";},600);
}

function defaultBack(){
if( loadBoolean("CanGoBack",true )){
  if(containerPage.length<2){
  // BUG FIX: dulu app.CreateYesNoDialog (tidak ada di bridge -> crash).
  // Sekarang dialog ditangani langsung oleh MainActivity.ShowYesNo.
  (window.__noop||function(){})("Tutup aplikasi ?");
  }
  else{
   hidePage(containerPage[containerPage.length-1]);
  }

}
else{
   showPopup("Tekan tanda silang 'x' untuk kembali" );
 }
 
}

function customBack(){
     $("#c-game").css({
                   left:"110%",
       })
     $("#splash img").get(0).style.animation="rotateZoomOut 0.4s  linear forwards";
     setTimeout( function(){
     app.Exit();
     },500);
}


function randBetween(min,max){
  return Math.floor(Math.random() * (max-min+1)) + min; 
}

/// preview image saat upload
function prevImg(event,img) {
  img.src = URL.createObjectURL(event.target.files[0]);
}

function showPopup(txt){
   app.ShowPopup( txt );
}
function showProgress(txt){
   showPage("ispinner","fadeIn");
}
function hideProgress(){
   hidePage("ispinner","fadeOut");
}
function saveText(key, val){
   app.SaveText(key,val );
}
function loadText(key,val){
   return app.LoadText(key,val );
}

function saveNumber(key, val){
   app.SaveNumber(key,val );
}
function loadNumber(key,val){
   return app.LoadNumber(key,val );
}

function saveBoolean(key,val){
   app.SaveBoolean(key,val );
}
function loadBoolean(key,val){
   return app.LoadBoolean(key,val );
}

function setOnError(cb){
   app.SetOnError(cb );
}
function setOptions(opt){
   app.SetOptions(opt );
}

function setOrientation(orient){
   app.SetOrientation(  orient )
}

function setScreenMode(mode){
   app.SetScreenMode(mode )
}
var randBetween=function(min,max){return Math.floor(Math.random()*(max-min+1))+min;};</script>

function openingFace(ball) {

// Satu langkah putaran global (asli: Tick200mils.run)
function tick() {

        // Wajah hasil sudah tiba penuh dari tick sebelumnya.
        if (bolehBerhenti && secCounter == ball.value - 1) {
            ball.stoped = true;

    $element.find(".right").removeClass("right").addClass("left");

    // (asli: fromXScale=0, fromYScale=0.8, pivotX=100%)
    $element.append('<img class="right" src="' + FACE_URI[face] + '">');

        "transition": "transform " + FRAME_MS + "ms " + EASE,

    });

    // (asli: toXScale=0, toYScale=0.8, pivotX=0%, fillAfter=false)
    $element.find(".left").each(function() {

        old.style["transform-origin"] = "0% 50%";
        old.style.transition = "transform " + FRAME_MS + "ms " + EASE;
        old.style.transform = "scale(0, 0.8)";

// MESIN KOMPOSISI (port harness "TheDice v6.9 - Transparent"):
// 100 ronde per siklus diacak Fisher-Yates, diacak ulang tiap
// siklus, reset saat aplikasi dibuka ulang.
var Composition = {
    singles: {1: 18, 2: 11, 3: 15, 4: 20, 5: 12, 6: 11},
    doubleCount: 5,
    tripleCount: 8,
    queue: [],

    pickFrom: function(pool) {
        return pool[Math.floor(Math.random() * pool.length)];
    },

    shuffle: function(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
    },

    buildCycle: function() {
        var rounds = [];
        for (var face in this.singles) {
            for (var i = 0; i < this.singles[face]; i++) {
                rounds.push({count: 1, face: Number(face)});
            }
        }
        for (var i = 0; i < this.doubleCount; i++) {
            rounds.push({count: 2, face: (i % 6) + 1});
        }
        for (var i = 0; i < this.tripleCount; i++) {
            rounds.push({count: 3, face: (i % 6) + 1});
        }
        return this.shuffle(rounds);
    },

    // Ronde berikutnya; siklus baru dibangun + diacak ulang
    // setelah 100 ronde habis.
    next: function() {
        if (this.queue.length === 0) {
            this.queue = this.buildCycle();
        }
        return this.queue.pop();
    }
};

var RuleEngine = {

    // Menetapkan hasil akhir SEBELUM animasi berjalan (arsitektur
    // aplikasi asli); animasi hanya menerima hasilnya.
    // TIGA DADU selalu tampil: hasil ronde komposisi ditampilkan
    // dalam 3 dadu, posisi dadu hasil diacak.
    // Hasil remote lolos langsung jika ada.
    determine: function(pre) {
        if (pre && pre.length == 3) {
            return pre;
        }
        var spec = Composition.next();
        var f = spec.face;
        var semua = [1, 2, 3, 4, 5, 6];

        if (spec.count === 3) {
            // TRIPLE: tiga dadu sama
            return [f, f, f];
        }
        if (spec.count === 2) {
            // DOUBLE: dua dadu hasil + satu pengisi beda
            var lain = Composition.pickFrom(
                semua.filter(function(v) { return v !== f; })
            );
            return Composition.shuffle([f, f, lain]);
        }
        // SINGLE: satu dadu hasil + dua pengisi beda sendiri
        // (agar tidak membentuk kembar yang salah baca)
        var sisa = semua.filter(function(v) { return v !== f; });
        var a = Composition.pickFrom(sisa);
        var b = Composition.pickFrom(
            sisa.filter(function(v) { return v !== a; })
        );
        return Composition.shuffle([f, a, b]);
    }
};
