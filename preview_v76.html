var app = {
    SetScreenMode: function(){}, EnableBackKey: function(){}, SetDebugEnabled: function(){},
    SetOrientation: function(){}, SetOptions: function(){}, SetBackColor: function(){},
    Exit: function(){ alert('exit'); }, CopyFile: function(){}, GetAppPath: function(){ return ''; },
    LoadBoolean: function(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return (v === null || v === undefined) ? d : v; } catch(e) { return d; } },

    <script>function select(q){
 return document.querySelector(q);
}

function selectAll(q){
 return document.querySelectorAll(q);
}

function elById(id){
 return document.getElementById(id);
}


function elAnim(el,anim){
    oldAnim=el.classList.item(el.classList.length-1);
    el.classList.remove(oldAnim);
    setTimeout(function(){
      el.classList.add("animate__animated","animate__"+anim);
    },200);
}

function showAndHide(page,animShow,animHide,time,text){
  if(text){
   elById(page).innerHTML= text;
  }
  showPage(page,animShow);
  setTimeout(hidePage,time,page,animHide);
}


function showPage(id,anim){
   window.scrollTo(0,0);
   var el=elById(id);
   if( el.style.display!="block"){
    el.style.display="block";
    zIndexPage+=1;
    el.style.zIndex=zIndexPage;
    oldAnim=el.classList.item(el.classList.length-1);
    el.classList.remove(oldAnim);
    el.classList.add("animate__animated","animate__"+(anim||"slideIn"));
    containerPage.push(id);
   }
}

function hidePage(id,anim){
    var el=elById(id);
    oldAnim=el.classList.item(el.classList.length-1);
    el.classList.remove(oldAnim);
    el.classList.add("animate__animated","animate__"+(anim||"rotateOutUpRight"));
    var index = containerPage.indexOf(id);
    if(index > -1) {
      containerPage.splice(index, 1);
      }
   
    setTimeout(function(){el.style.display="none";},600);
}

function defaultBack(){
if( loadBoolean("CanGoBack",true )){
  if(containerPage.length<2){
  // BUG FIX: dulu app.CreateYesNoDialog (tidak ada di bridge -> crash).
  // Sekarang dialog ditangani langsung oleh MainActivity.ShowYesNo.
  app.ShowYesNo("Tutup aplikasi ?");
  }
  else{
   hidePage(containerPage[containerPage.length-1]);
  }

}
else{
   showPopup("Tekan tanda silang 'x' untuk kembali" );
 }
 
}

function customBack(){
     $("#c-game").css({
                   left:"110%",
       })
     $("#splash img").get(0).style.animation="rotateZoomOut 0.4s  linear forwards";
     setTimeout( function(){
     app.Exit();
     },500);
}


function randBetween(min,max){
  return Math.floor(Math.random() * (max-min+1)) + min; 
}

/// preview image saat upload
function prevImg(event,img) {
  img.src = URL.createObjectURL(event.target.files[0]);
}

function showPopup(txt){
   app.ShowPopup( txt );
}
function showProgress(txt){
   showPage("ispinner","fadeIn");
}
function hideProgress(){
   hidePage("ispinner","fadeOut");
}
function saveText(key, val){
   app.SaveText(key,val );
}
function loadText(key,val){
   return app.LoadText(key,val );
}

function saveNumber(key, val){
   app.SaveNumber(key,val );
}
function loadNumber(key,val){
   return app.LoadNumber(key,val );
}

function saveBoolean(key,val){
   app.SaveBoolean(key,val );
}
function loadBoolean(key,val){
   return app.LoadBoolean(key,val );
}

function setOnError(cb){
   app.SetOnError(cb );
}
function setOptions(opt){
   app.SetOptions(opt );
}

function setOrientation(orient){
   app.SetOrientation(  orient )
}

function setScreenMode(mode){
   app.SetScreenMode(mode )
}</script>

#sleep img{
  width:30px;
  height:30px;
  margin:0;
  flex:0 0 30px;
}

#sleep span{
  flex:0 0 auto;
}

.c-dadu{
  position:absolute;
  width:100px;
  left:50%;
  /* v7.5: persis tengah seperti gravity CENTER asli (dulu -40%) */
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  background:none;
  padding:0;
  display:flex;
  flex-direction: column;
}

#c-game .c-dadu{
 pointer-events: none;
}

.dice, .option{
  position:relative;
  display:block;
  margin:0;
  width:100px;
  height:100px;
  align:center;
}

/* v7.5: tombol menu = wajah dadu 1/2/3 asli (button1/2/3.xml ->
   dice_one/two/three). Hanya tombol tengah bermargin 10dp seperti
   start.xml asli (jeda 10px di kedua sisi). Tanpa warna tambahan. */
.option{
 width:100px;
 height:100px;
 background:none;
 border-radius:0;
 margin-top:0;
 margin-bottom:0;
}

.option:nth-child(2){
  margin-top:10px;
  margin-bottom:10px;
}

.dice{
    position:relative;
    /* v6.7: #dfdfdf = dice_bg.xml asli. Lapisan dasar gelap, selalu tampak
       di pojok saat wajah terang meluncur masuk/keluar -- inilah yang membuat
       bentuk dadu konsisten di setiap frame roll di aplikasi asli. */
    background:#dfdfdf;

    /* overflow:hidden (bukan auto) agar sudut benar-benar dipotong
       bulat di semua WebView */
    overflow:hidden;
    border-radius:20%;
    /* asli dice.xml: hanya baris dadu kedua yang layout_margin 10dp
       -> jeda 10px seragam antar dadu */
    margin:0 0 10px 0;
    display:flex;
    align-items:center;
    width:100px;
    height:100px;
 }

.dice:last-child{
    margin-bottom:0;
}

 .dice img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    margin:0;
    /* v6.6: border-radius langsung di tiap gambar wajah — bug
       promosi layer GPU di sebagian WebView membuat clip induk
       gagal; pemotongan di layer sendiri selalu berlaku */
    border-radius:20%;
    overflow:hidden;
 }

.dice .left{
    width:100%;
    height:100%;
}

.dice .right{
   width:100%;
   height:100%;
}

/* Akselerasi GPU untuk animasi transform (port show_right/hide_left) */
.right, .left {
     will-change: transform;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
}


@keyframes roll{
  0% { -webkit-transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
  100% { -webkit-transform: rotateX(0deg) rotateY(360deg) rotateZ(0deg); }
}

@keyframes ciut{
  from{
   width:100%;
  }
  to{
   width:0;
  }
}

//  ROLL ENGINE v7.6 — PORT EKSAK The Dice 1.4 ASLI (net.dzyga)
//
//  AUDIT 10 Okt 2026 vs dex asli membuktikan v7.4 masih menyimpang di
//  tiga titik mekanik. v7.5 membekukan semuanya ke perilaku asli:
//
//  1. TEMPO 200ms (asli: Tick200mils + anim 200ms; v7.4 sempat 225ms).
//  2. FRAME PEMBUKA: asli HARD-CUT wajah lama diganti wajah 6 TANPA
//     animasi keluar, lalu DALAM INSTAN YANG SAMA animasi 6->1 berjalan
//     (setImageResource(DICE_IMG[5]) + hideLeft/showRight serentak).
//     Satu gerakan 200ms menuju wajah 1. v7.4 dulu transisi old->6
//     lalu diam -> butuh 450ms. Wajah 6 kini hanya tampak sebagai
//     lapisan yang menyusut, persis asli.
//  3. URUTAN WAJAH PER TICK: tick k menampilkan transisi wajah k -> k+1
//     (asli: dice = DICE_IMG[secCounter], diceA = DICE_IMG[secCounter+1];
//     secCounter = k-1 => masuk wajah k+1 = secCounter+2). v7.4 tertinggal
//     satu wajah.
//  4. MOMEN BERHENTI: dadu berhenti PADA tick ketika secCounter ==
//     randArr (asli: countdownFinished && secCounter == randArr ->
//     clearAnimation, wajah hasil SUDAH tiba penuh dari tick sebelumnya).
//     Tidak ada transisi tambahan saat mendarat. v7.4 memulai satu
//     transisi ekstra. Tanpa animasi baru saat stop = tanpa snap.
//  5. TAP SAAT BERPUTAR = RESTART PENUH (asli: onClick mengundi ulang,
//     stopped[] reset, konter 5, hitung mundur 3s baru). v7.4 mengabaikan
//     tap dan membuang satu ronde komposisi.
//  6. ATURAN SENTUH v7.2 (jari menempel = dadu tak mendarat) kini hanya
//     aktif di mode "kk". Mode default = perilaku asli murni: dadu
//     mendarat setelah 3 detik apa pun yang disentuh.
//
//  Komposisi 100 ronde (87/5/8) tetap: hasil DITETAPKAN SEBELUM animasi
//  (arsitektur asli: randArr diundi saat tap, animasi hanya menerima).
//
//   Perilaku default = tak bisa dibedakan dari APK asli.
//  v7.6: hasil murni acak per dadu, jumlah dadu ikut menu 1/2/3.

var FRAME_MS = 200;      // asli: Tick200mils, postDelayed 200L
var MIN_SPIN_MS = 3000;   // asli: diceLayout.postDelayed 3000L
var TOUCH_CALM_MS = 400;  // hanya mode "kk" (fitur operator, bukan asli)

// Konter global wajah (0..5 = wajah 1..6), asli: secCounter
var secCounter = 0;
var minSpinDone = false;  // asli: countdownFinished
var tickTimer = null;     // asli: removeCallbacks/postDelayed di dice[0]
var spinTimer = null;
var balls = [];
var rolling = false;

// Wajah masuk pada konter sekarang (asli: DICE_IMG[secCounter+1])
function wrapFace(n) {
    return n > 6 ? n - 6 : n;
}

// FRAME PEMBUKA ASLI — dipanggil saat lemparan dimulai/restart:
//  - seluruh isi dadu diganti SEKETIKA (asli: setImageResource,
//    wajah hasil lemparan sebelumnya hilang tanpa animasi keluar)
//  - lapisan .left = wajah 6 (akan menyusut keluar kiri)
//  - lapisan .right = wajah 1 (tumbuh dari tepi kanan)
//  - keduanya berjalan serentak dalam satu gerakan FRAME_MS
function openingFace(ball) {
    var $element = $(ball.element);
    var EASE = "cubic-bezier(0.42, 0, 0.58, 1)";
    $element.empty();
    $element.append('<img class="left" src="' + FACE_URI[6] + '"><img class="right" src="' + FACE_URI[1] + '">');
    var $l = $element.find(".left");
    var $r = $element.find(".right");
    $l.css({ "transform-origin": "0% 50%", "transform": "scale(1, 1)", "transition": "none" });
    $r.css({ "transform-origin": "100% 50%", "transform": "scale(0, 0.8)", "transition": "none" });
    $l.get(0).offsetWidth; // paksa reflow sebelum transisi dipasang
    $l.css({ "transition": "transform " + FRAME_MS + "ms " + EASE, "transform": "scale(0, 0.8)" });
    $r.css({ "transition": "transform " + FRAME_MS + "ms " + EASE, "transform": "scale(1, 1)" });
}

function initRoll(diceEls) {
    rolling = true;
    secCounter = 5;        // asli: secCounter = 5 saat dadu dilempar
    minSpinDone = false;   // asli: countdownFinished = false
    balls = [];
    for (var i = 0; i < diceEls.length; i++) {
        balls.push({ element: diceEls[i], value: results[i], stoped: false });
    }
    // Asli: onClick mengulang pengaturan pembuka untuk SEMUA dadu —
    // dipanggil juga saat lemparan direstart di tengah putaran.
    balls.forEach(openingFace);
    // Asli: dice[0].removeCallbacks(tick) + postDelayed(tick, 200L)
    if (tickTimer) clearTimeout(tickTimer);
    tickTimer = setTimeout(tick, FRAME_MS);
    // Asli: diceLayout.postDelayed(countdownFinished=true, 3000L)
    if (spinTimer) clearTimeout(spinTimer);
    spinTimer = setTimeout(function() { minSpinDone = true; }, MIN_SPIN_MS);
}

// Satu langkah putaran global (asli: Tick200mils.run)
function tick() {
    // Majukan konter global, kembali ke 0 setelah 5 (asli)
    secCounter += 1;
    if (secCounter >= 6) {
        secCounter = 0;
    }

    // Mode kk: dadu tak mendarat selama layar disentuh (v7.2, fitur
    // operator). Mode default: boleh berhenti murni dari hitung mundur,
    // persis asli.
    var bolehBerhenti = minSpinDone;
    if (typeof mode !== "undefined" && mode == "kk") {
        bolehBerhenti = bolehBerhenti &&
            !isTouchDown &&
            (Date.now() - lastTouchAt) >= TOUCH_CALM_MS;
    }

    // Wajah yang masuk pada tick ini (asli: DICE_IMG[secCounter+1])
    var face = wrapFace(secCounter + 2);
    var anySpinning = false;

    balls.forEach(function(ball) {
        if (ball.stoped) {
            return;
        }
        // Asli: if (countdownFinished && secCounter == randArr[i])
        //   -> stopped[i] = true, clearAnimation, TANPA wajah baru.
        // Wajah hasil sudah tiba penuh dari tick sebelumnya.
        if (bolehBerhenti && secCounter == ball.value - 1) {
            ball.stoped = true;
            return;
        }
        showFace(ball, face);
        anySpinning = true;
    });

    if (anySpinning) {
        tickTimer = setTimeout(tick, FRAME_MS); // asli: postDelayed(tick, 200L)
    } else {
        onAllStoped(); // asli: tick berhenti dipost ulang begitu semua diam
    }
}

function onAllStoped() {
    rolling = false;
    prevRes = results;
    preRes = [];
    round += 1;
    isRemoted = false;
}

// Tampilkan satu wajah pada satu dadu (port show_right.xml + hide_left.xml)
function showFace(ball, face) {
    var $element = $(ball.element);
    var EASE = "cubic-bezier(0.42, 0, 0.58, 1)"; // ~= AccelerateDecelerate

    // Wajah sebelumnya dipromosikan jadi wajah lama
    $element.find(".right").removeClass("right").addClass("left");

    // Wajah baru dipasang dalam keadaan sliver di tepi kanan
    // (asli: fromXScale=0, fromYScale=0.8, pivotX=100%)
    $element.append('<img class="right" src="' + FACE_URI[face] + '">');
    var $newFace = $element.find(".right");
    $newFace.css({
        "transform-origin": "100% 50%",
        "transform": "scale(0, 0.8)",
        "transition": "none"
    });

    // Paksa satu reflow, lalu transisi ke ukuran penuh
    $newFace.get(0).offsetWidth;
    $newFace.css({
        "transition": "transform " + FRAME_MS + "ms " + EASE,
        "transform": "scale(1, 1)"
    });

    // Wajah lama menyusut jadi sliver di tepi kiri lalu dibuang
    // (asli: toXScale=0, toYScale=0.8, pivotX=0%, fillAfter=false)
    $element.find(".left").each(function() {
        var old = this;
        old.style["transform-origin"] = "0% 50%";
        old.style.transition = "transform " + FRAME_MS + "ms " + EASE;
        old.style.transform = "scale(0, 0.8)";
        setTimeout(function() {
            $(old).remove();
        }, FRAME_MS);
    });
}

   MATI seperti asli). Menu memakai wajah dadu 1/2/3 asli
   dengan efek tekan wajah kosong (dice_bg asli).
   ===================================================== */

// v7.6: MESIN MURNI ACAK — port java.util.Random asli.
// Tiap dadu diundi sendiri (nextInt(6)+1), saling bebas,
// jumlah dadu mengikuti pilihan menu 1/2/3 (asli: diceNumber).
var RuleEngine = {
    determine: function(pre, n) {
        if (pre && pre.length) {
            // lolos-langsung: hasil operator (mode kk) / remote
            return pre.slice(0, n || pre.length);
        }
        var out = [];
        for (var i = 0; i < (n || 3); i++) {
            out.push(1 + Math.floor(Math.random() * 6));
        }
        return out;
    }
};

function rollDice(e) {
    var el = elById("c-game");
    var w = el.offsetHeight / 3;
    var x = e.changedTouches[0].pageY;

    // Area sentuh hanya memilih INPUT untuk Rule Engine (mode kk).
    // Hasil final tetap ditetapkan oleh RuleEngine.determine
    // SEBELUM animasi berjalan (Aturan 1 dan 6).
    if (mode == "kk") {
        if (x <= w) {
            preRes = randLeft();
        } else if (x >= w * 2) {
            preRes = randRight();
        } else {
            preRes = getResults();
        }
    } else {
        preRes = []; // mode default: murni acak (asli)
    }

    // ATURAN 1: hasil ditetapkan lebih dulu oleh Rule Engine
    results = RuleEngine.determine(preRes, diceCount);

    // v7.6 = ASLI (onClick): lemparan SELALU dimulai ulang penuh —
    // termasuk saat dadu masih berputar (restart, bukan diabaikan).
    // initRoll mengundi ulang pembuka 6->1, mereset konter dan
    // hitung mundur 3 detik, persis onClick TheDiceActivity asli.
    initRoll($(".dice:visible").toArray());
}

// getResults = penyusun input untuk Rule Engine
// (pola +1 / acak / lolos-langsung hasil remote serv_OnReceive).
// Hasil final SELALU lewat RuleEngine.determine.
function getResults() {
    if (preRes.length == 3) {
        return preRes; // hasil remote (serv_OnReceive) lolos langsung
    }
    return RuleEngine.determine(null, diceCount);
}
       
function randRight() {
            return [randBetween(1, 6), randBetween(1, 6), randBetween(1, 6)];
        }
       
        function randLeft() {
            return [randBetween(1, 6), randBetween(1, 6), randBetween(1, 6)];
        }
       
        function tambahSemua(arr){
          var res=0;
          for( var i=0;i< arr.length;i++){
           res+= arr[i];
          }
          
          return res;
        }

        // Fungsi penerima perintah remote
        function serv_OnReceive(data) {
            preRes = data.split("");
            isRemoted = true;
        }
       
        function showGame() {
            $(".dice img").attr("src", "Img/6.svg");
            $("#c-game").css("left", 0);
            elById("c-menu").style.animation = "none";
            OnBack = hideGame;
            
            // "Don't sleep": baca preferensi tersimpan.
            // ASLI: SharedPreferences "Awake" default FALSE —
            // jadi v7.6 juga default MATI (centang tak terlihat).
            nosleep = app.LoadBoolean("nosleep", false);
            applySleep();
                
        }
     
        function hideGame() {
            $("#c-game").css("left", "100%");
            OnBack = function() { app.Exit(); }; // app._3
        }
       
        // Terapkan status sakelar layar ke tampilan (v7.6):
        // centang hijau = checker.png asli, kosong = nooll.png asli
        function applySleep() {
            elById("sleepimg").src = nosleep ? "Img/checker.png" : "Img/nooll.png";
            app.PreventScreenLock(nosleep); // app._169
        }

        // Sakelar tetap menyala (Wakelock asli: SCREEN_BRIGHT_WAKE_LOCK;
        // di WebView = FLAG_KEEP_SCREEN_ON, efek visual sama)
        function togleSleep(e) {
            e.stopPropagation();
            nosleep = !nosleep;
            applySleep();
            app.SaveBoolean("nosleep", nosleep);
        }
       
        // Tampilkan sejumlah N dadu TANPA membuka layar game
        // (warisan v7.2; v7.6 selalu memanggil dengan 3).
        function setDiceCount(num) {
            var dice = $(".dice");
            for (var i = 0; i < dice.length; i++) {
                if (i >= num) {
                    dice.eq(i).hide();
                } else {
                    dice.eq(i).show();
                }
            }
        }

        // Menu 1/2/3 dadu (asli): pilihan menentukan jumlah dadu
        // yang dilontarkan — persis Dices Number di aplikasi asli.
        var diceCount = 3;
        function setDice(num) {
            diceCount = num;
            setDiceCount(num);
            showGame();
        }

        // Efek tekan tombol menu asli (button1/2/3.xml: state_pressed
        // -> dice_bg = wajah kosong #dfdfdf)
        function pressOpt(el) {
            el.src = "Img/blank.svg";
        }
        function releaseOpt(el, n) {
            el.src = "Img/" + n + ".svg";
        }
    </script>

<script>
document.addEventListener('click', function(e){
  var t = e.target;
  var sl = t.closest && t.closest('#sleep');
  if (sl) {
    togleSleep({ stopPropagation: function(){} });
    return;
  }
  if (t.classList && t.classList.contains('option')) {
    var opts = document.querySelectorAll('.option');
    var n = Array.prototype.indexOf.call(opts, t) + 1;
    setDice(n);
    return;
  }
  var game = document.getElementById('c-game');
  if (game && game.offsetLeft < 10) {
    var ev = new Event('touchend');
    ev.changedTouches = [{pageX: e.pageX, pageY: e.pageY}];
    ev.preventDefault = function(){};
    game.ontouchend(ev);
  }
});
